services:
  # ── 제공 서비스 (수정 금지) / Provided service (do not modify) ──
  mock-upstream:
    build: ./mock-upstream
    environment:
      # FAIL_RATE=0.3 docker compose up  → upstream fails ~30% of calls.
      - FAIL_RATE=${FAIL_RATE:-0}
    ports:
      - "9000:9000"

  # ── 레거시 v1 서버 (v1 프로토콜은 계속 동작해야 합니다)
  #    Legacy v1 server (the v1 protocol must keep working) ──
  legacy-server:
    build: ./legacy-server
    environment:
      - UPSTREAM_URL=http://mock-upstream:9000
    ports:
      - "8080:8080"
    depends_on:
      - mock-upstream

  # ── 지원자 구현 영역 / Your services go here ────────────
  # 여러분의 서비스를 여기에 추가하세요. 예:
  # Add your services below. For example:
  #
  # app-server:
  #   build: ./server
  #   environment:
  #     - UPSTREAM_URL=http://mock-upstream:9000
  #   ports:
  #     - "8081:8081"
  #   depends_on:
  #     - mock-upstream
  #
  # web:
  #   build: ./web
  #   ports:
  #     - "3000:3000"        # evaluators open http://localhost:3000
  #   depends_on:
  #     - app-server
