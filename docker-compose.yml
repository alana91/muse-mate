services:
  # ── 제공 서비스 (수정 금지) / Provided service (do not modify) ──
  mock-upstream:
    build: ./mock-upstream
    environment:
      # FAIL_RATE=0.3 docker compose up  → upstream fails ~30% of calls.
      - FAIL_RATE=${FAIL_RATE:-0}
    ports:
      - "9000:9000"

  # ── 레거시 v1 서버 (v1 프로토콜은 계속 동작해야 합니다)
  #    Legacy v1 server (the v1 protocol must keep working) ──
  legacy-server:
    build: ./legacy-server
    environment:
      - UPSTREAM_URL=http://mock-upstream:9000
    ports:
      - "8080:8080"
    depends_on:
      - mock-upstream

  # ── MuseMate v2 application ────────────────────────────
  app-server:
    build: ./app-server
    environment:
      - PORT=3000
      - UPSTREAM_URL=http://mock-upstream:9000
      - UPSTREAM_TIMEOUT_MS=${UPSTREAM_TIMEOUT_MS:-10000}
      - TICKET_SECRET=${TICKET_SECRET:-development-only-secret}
      - TICKET_TTL_SECONDS=${TICKET_TTL_SECONDS:-1800}
      - GREETING_CACHE_TTL_SECONDS=${GREETING_CACHE_TTL_SECONDS:-86400}
      - GREETING_CACHE_MAX_ENTRIES=${GREETING_CACHE_MAX_ENTRIES:-100}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - mock-upstream
